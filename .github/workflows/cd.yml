name: Node.js Continuous Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package application
        run: |
          zip -r deploy.zip . \
            -x "node_modules/*" \
               ".git/*" \
               ".github/*" \
               "coverage/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Upload deployment package
        run: |
          aws s3 cp deploy.zip \
            s3://${{ vars.EB_S3_BUCKET }}/deploy-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-label "build-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ vars.EB_S3_BUCKET }}",S3Key="deploy-${{ github.sha }}.zip"

      - name: Deploy application
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "build-${{ github.sha }}"

      - name: Deployment summary
        run: |
          echo "Deployment submitted successfully."
          echo "Commit: ${{ github.sha }}"
